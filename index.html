<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io2/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io2/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io2/favicon-16x16.png">
<link rel="manifest" href="favicon_io2/site.webmanifest">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <button class="theme-toggle" id="theme-toggle">🌙</button>
    <div class="maha-container">
    <div class="container">
        <h1>Currency Converter</h1>
        <form>
            <div class="amount">
                <p>Enter Amount</p>
                <input value="1" type="text">
            </div>
            <div class="dropdown">
            <div class="from">
             <p>From</p>
             <div class="select-container">
                <img src="https://flagsapi.com/US/flat/64.png">
                <select name="from">
                </select>
             </div>
            </div>
            <i class="fa-solid fa-arrow-right-arrow-left"></i>
            <div class="to">
             <p>To</p>
             <div class="select-container">
                <img src="https://flagsapi.com/IN/flat/64.png">
                <select name="to">
                </select>
             </div>
            </div>
            </div>
            <div class="msg">1USD=94.28INR</div>
            <button>Get Exchange Rate</button>
        </form>
    </div>
     <div class="feedback-section">
        <h3>Enjoying the calculator?</h3>
        <p>I'd love to hear your feedback!</p>
        <a href="" target="_blank" class="feedback-button" rel="noopener noreferrer">⭐ Give Feedback</a>
    </div>
    </div>
</body>
<script src="codes.js"></script>
<script src="app.js"></script>
</html>
